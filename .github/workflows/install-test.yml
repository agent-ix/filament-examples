name: Install test

# Manual only. Runs the commands in install-test/steps.md on a bare
# ubuntu:22.04 container on an x86_64 runner.
on:
  workflow_dispatch:
    inputs:
      driver:
        description: "How the install steps get the driver: release (download the archive) or source (build with Rust)."
        required: false
        type: choice
        options: [release, source]
        default: release

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runner tests
        run: make test
      - name: Run the install steps
        run: make install-test INSTALL_DRIVER=${{ inputs.driver || 'release' }}
