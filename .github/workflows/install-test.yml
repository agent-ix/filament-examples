name: Install test

# Manual only. Runs the commands in install-test/steps.md on a bare
# ubuntu:22.04 container on an x86_64 and an arm64 runner: the release path in
# bash and zsh, the source path in bash. A macOS job runs the release path in zsh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, driver: release, shell: bash }
          - { runner: ubuntu-latest, driver: release, shell: zsh }
          - { runner: ubuntu-latest, driver: source, shell: bash }
          - { runner: ubuntu-24.04-arm, driver: release, shell: bash }
          - { runner: ubuntu-24.04-arm, driver: release, shell: zsh }
          - { runner: ubuntu-24.04-arm, driver: source, shell: bash }
    name: install (${{ matrix.driver }}, ${{ matrix.shell }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runner tests
        run: make test
      - name: Run the install steps
        run: make install-test INSTALL_DRIVER=${{ matrix.driver }} INSTALL_SHELL=${{ matrix.shell }}

  # The release path in zsh on macOS, without a container: the steps run in the
  # runner's own shell.
  install-macos:
    name: install (release, zsh, macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install jq if the runner lacks it
        run: command -v jq >/dev/null || brew install jq
      - name: Run the install steps
        run: make install-test-host
