name: Install test

# Manual only. Runs the commands in install-test/steps.md on a bare
# ubuntu:22.04 container, once per path (release download, source build) on
# each of an x86_64 and an arm64 runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        driver: [release, source]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: install (${{ matrix.driver }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Runner tests
        run: make test
      - name: Run the install steps
        run: make install-test INSTALL_DRIVER=${{ matrix.driver }}
