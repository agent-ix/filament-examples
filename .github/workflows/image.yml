name: Toolchain image

# Manual only. Builds ghcr.io/agent-ix/filament-toolchain for linux/amd64 and
# linux/arm64, each on a native runner (no emulation), runs image/smoke.sh on
# each build before anything is pushed, then publishes one multi-platform tag.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags to publish, separated by spaces."
        required: true
        default: "latest"
      fsl_version:
        description: "Driver release to put in the image, such as 0.1.1. \"latest\" is the newest release."
        required: true
        default: "latest"
      fsl_source:
        description: "release downloads the driver release archive and checks its checksum. source builds the driver from its repository."
        required: true
        type: choice
        options: [release, source]
        default: release

env:
  IMAGE: ghcr.io/agent-ix/filament-toolchain

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: smoke:local
          build-args: |
            FSL_VERSION=${{ inputs.fsl_version }}
            FSL_SOURCE=${{ inputs.fsl_source }}

      - name: Smoke test
        run: docker run --rm smoke:local smoke.sh

      - name: Image size
        run: |
          docker image ls smoke:local --format 'size on disk: {{.Size}}'
          docker image inspect smoke:local --format 'content bytes: {{.Size}}'

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FSL_VERSION=${{ inputs.fsl_version }}
            FSL_SOURCE=${{ inputs.fsl_source }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=FSL driver, Markdown tool, quoin, jq, make, git and Node for the Filament examples and tutorials
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest for the merge job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-platform tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          refs=$(cd "$RUNNER_TEMP/digests" && printf "$IMAGE@sha256:%s " *)
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$IMAGE:$tag" $refs
          done
      - name: Show the result
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do docker buildx imagetools inspect "$IMAGE:$tag"; done
