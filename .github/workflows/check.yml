name: Check examples

# Manual only: CI minutes are not spent on push. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      driver:
        description: "Where the FSL driver comes from: source (build the pinned filament-driver revision), image (the published toolchain image) or release (a driver release archive, checked against its checksum)."
        required: true
        type: choice
        options: [image, release, source]
        default: source
      image:
        description: "Toolchain image to run in when driver is image."
        required: false
        default: ghcr.io/agent-ix/filament-toolchain:latest
      fsl_version:
        description: "Driver release to download when driver is release, such as 0.1.1. latest is the newest release."
        required: false
        default: latest
      fsl_revision:
        description: "Exact filament-driver commit to build when driver is source."
        required: false
        default: 158bc4735167e75347afbfa883e03c1013d45f2d

permissions:
  contents: read
  packages: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image path remains available for checking the published toolchain.
      # The default source path below builds an exact first-party driver revision.
      - name: Log in to the registry
        if: inputs.driver == 'image'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check running cases and staged cases in the image
        if: inputs.driver == 'image'
        env:
          IMAGE: ${{ inputs.image }}
        run: docker run --rm --volume "$PWD:/work" --workdir /work "$IMAGE" make test check staged

      - uses: actions/setup-node@v4
        if: inputs.driver != 'image'
        with:
          node-version: "22"

      # The only step that knows where the driver comes from when the image is not used.
      - name: Provide the FSL driver
        if: inputs.driver != 'image'
        id: driver
        env:
          DRIVER: ${{ inputs.driver }}
          FSL_VERSION: ${{ inputs.fsl_version }}
          FSL_REVISION: ${{ inputs.fsl_revision }}
        run: |
          if [ "$DRIVER" = release ]; then
            repo=https://github.com/agent-ix/filament-driver
            if [ "$FSL_VERSION" = latest ]; then
              tag=$(curl -sSf --location --output /dev/null --write-out '%{url_effective}' "$repo/releases/latest")
              tag=${tag##*/}
              case "$tag" in v*) ;; *) echo "No release of the FSL driver was found at $repo/releases" >&2; exit 1 ;; esac
            else tag=v${FSL_VERSION#v}; fi
            archive="fsl-$tag-x86_64-unknown-linux-gnu.tar.gz"
            mkdir "$RUNNER_TEMP/fsl-bin"
            cd "$RUNNER_TEMP/fsl-bin"
            curl -sSf --location --remote-name "$repo/releases/download/$tag/$archive"
            curl -sSf --location --remote-name "$repo/releases/download/$tag/SHA256SUMS.txt"
            grep " $archive\$" SHA256SUMS.txt | sha256sum --check -
            tar -xzf "$archive" fsl
            echo "path=$RUNNER_TEMP/fsl-bin/fsl" >> "$GITHUB_OUTPUT"
          else
            git clone --no-checkout --filter=blob:none https://github.com/agent-ix/filament-driver "$RUNNER_TEMP/filament-driver"
            git -C "$RUNNER_TEMP/filament-driver" fetch --depth 1 origin "$FSL_REVISION"
            git -C "$RUNNER_TEMP/filament-driver" checkout --detach FETCH_HEAD
            rustup toolchain install stable --profile minimal
            CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 cargo build --locked -p fsl-cli --manifest-path "$RUNNER_TEMP/filament-driver/Cargo.toml"
            echo "path=$RUNNER_TEMP/filament-driver/target/debug/fsl" >> "$GITHUB_OUTPUT"
          fi

      - name: Check running cases and staged cases with the pinned source driver
        if: inputs.driver == 'source'
        env:
          FSL_PATH: ${{ steps.driver.outputs.path }}
        run: make runner-test test check staged FSL="$FSL_PATH"

      - name: Check a compatible example with the release driver
        if: inputs.driver == 'release'
        env:
          FSL_PATH: ${{ steps.driver.outputs.path }}
        run: FSL="$FSL_PATH" cargo run --quiet --locked --manifest-path tools/fsl-examples/Cargo.toml -- check shop --case values-line-total
