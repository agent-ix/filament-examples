name: Check examples

# Manual only: CI minutes are not spent on push. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      driver:
        description: "Where the FSL driver comes from: image (the published toolchain image), binary (a prebuilt release archive at fsl_binary_url) or source (build quire-driver)."
        required: true
        type: choice
        options: [image, binary, source]
        default: image
      image:
        description: "Toolchain image to run in when driver is image."
        required: false
        default: ghcr.io/agent-ix/filament-toolchain:latest
      fsl_binary_url:
        description: "URL of a prebuilt FSL driver release archive, with {target} for the platform. Used when driver is binary."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default path: run the checks in the toolchain image.
      - name: Check running cases and staged cases in the image
        if: inputs.driver == 'image'
        env:
          IMAGE: ${{ inputs.image }}
        run: docker run --rm --volume "$PWD:/work" --workdir /work "$IMAGE" make test check staged

      - uses: actions/setup-node@v4
        if: inputs.driver != 'image'
        with:
          node-version: "22"

      # The only step that knows where the driver comes from when the image is not used.
      - name: Provide the FSL driver
        if: inputs.driver != 'image'
        id: driver
        env:
          DRIVER: ${{ inputs.driver }}
          FSL_BINARY_URL: ${{ inputs.fsl_binary_url }}
        run: |
          if [ "$DRIVER" = binary ]; then
            url=$(echo "$FSL_BINARY_URL" | sed "s/{target}/x86_64-unknown-linux-gnu/")
            mkdir "$RUNNER_TEMP/fsl-bin"
            curl --fail --location "$url" | tar -xz -C "$RUNNER_TEMP/fsl-bin" quire
            echo "path=$RUNNER_TEMP/fsl-bin/quire" >> "$GITHUB_OUTPUT"
          else
            git clone --depth 1 https://github.com/agent-ix/quire-driver "$RUNNER_TEMP/quire-driver"
            rustup toolchain install stable --profile minimal
            cargo build --locked -p quire-cli --manifest-path "$RUNNER_TEMP/quire-driver/Cargo.toml"
            echo "path=$RUNNER_TEMP/quire-driver/target/debug/quire" >> "$GITHUB_OUTPUT"
          fi

      - name: Check running cases and staged cases
        if: inputs.driver != 'image'
        env:
          FSL_PATH: ${{ steps.driver.outputs.path }}
        run: make test check staged FSL="$FSL_PATH"
