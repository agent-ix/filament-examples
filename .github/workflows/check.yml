name: Check examples

# Manual only: CI minutes are not spent on push. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      fsl_binary_url:
        description: "URL of a prebuilt FSL driver binary. Leave empty to build the driver from source."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The only step that knows where the driver comes from. Replace it with a
      # prebuilt binary or a container image and the rest of the job is unchanged.
      - name: Provide the FSL driver
        id: driver
        env:
          FSL_BINARY_URL: ${{ inputs.fsl_binary_url }}
        run: |
          if [ -n "$FSL_BINARY_URL" ]; then
            curl --fail --location --output "$RUNNER_TEMP/fsl" "$FSL_BINARY_URL"
            chmod +x "$RUNNER_TEMP/fsl"
            echo "path=$RUNNER_TEMP/fsl" >> "$GITHUB_OUTPUT"
          else
            git clone --depth 1 https://github.com/agent-ix/quire-driver "$RUNNER_TEMP/quire-driver"
            rustup toolchain install stable --profile minimal
            cargo build --locked -p quire-cli --manifest-path "$RUNNER_TEMP/quire-driver/Cargo.toml"
            echo "path=$RUNNER_TEMP/quire-driver/target/debug/quire" >> "$GITHUB_OUTPUT"
          fi

      - name: Runner tests
        run: make test

      - name: Check running cases and staged cases
        run: make check staged FSL="${{ steps.driver.outputs.path }}"
