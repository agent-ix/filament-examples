[package]
name = "foundations-examples"
version = "0.0.0"
edition = "2021"
publish = false

# The shared libraries below the Filament compiler, by git on `main`. Cargo.lock
# records the commit each one resolved to. filament-semantic-value names
# filament-exact and quire-canonical the same way, so each is built once.
[dependencies]
filament-exact = { git = "https://github.com/agent-ix/filament-exact", branch = "main" }
filament-walk = { git = "https://github.com/agent-ix/filament-walk", branch = "main" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main", features = ["serde_json"] }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", branch = "main" }
filament-eval = { git = "https://github.com/agent-ix/filament-eval", branch = "main" }
filament-checked = { git = "https://github.com/agent-ix/filament-eval", branch = "main", default-features = false }
ix-cli-kit = { git = "https://github.com/agent-ix/ix-cli-kit", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
