[package]
name = "fsl-examples"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Runs the filament-examples manifests through the FSL driver and compares each outcome by structure."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
