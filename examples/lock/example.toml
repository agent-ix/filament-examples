# Two processes and a lock: fairness and deadlock
name = "lock"
summary = "Two processes take turns on a lock. Which process is served depends on fairness, and two locks taken in opposite orders can deadlock."
model = "model/lock.semantic-ir.json"

[[case]]
id = "fairness-without-fairness"
rule = "ServedWithoutFairness"
statement = "Process 1 holds the lock again and again."
file = "rules/fairness/one-served.fsl"
command = "compile requests/fairness/one-served.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Model checking reference (fairness)"

[[case]]
id = "fairness-weak-whole"
rule = "ServedIfAcquireIsWeaklyFair"
statement = "Process 1 holds the lock again and again, if some acquire that stays enabled is taken."
file = "rules/fairness/one-served.fsl"
command = "compile requests/fairness/one-served.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Model checking reference (fairness)"

[[case]]
id = "fairness-strong-whole"
rule = "ServedIfAcquireIsStronglyFair"
statement = "Process 1 holds the lock again and again, if some acquire that is enabled again and again is taken: process 2 can still take every turn."
file = "rules/fairness/one-served.fsl"
command = "compile requests/fairness/one-served.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Model checking reference (fairness)"

[[case]]
id = "fairness-weak-each"
rule = "ServedIfEachAcquireIsWeaklyFair"
statement = "Process 1 holds the lock again and again, if every acquire that stays enabled is taken."
file = "rules/fairness/one-served.fsl"
command = "compile requests/fairness/one-served.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Model checking reference (fairness)"

[[case]]
id = "fairness-strong-each"
rule = "ServedIfEachAcquireIsStronglyFair"
statement = "Process 1 holds the lock again and again, if every acquire that is enabled again and again is taken."
file = "rules/fairness/one-served.fsl"
command = "compile requests/fairness/one-served.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Model checking reference (fairness)"

[[case]]
id = "fairness-counted-window"
rule = "ServedSoon"
statement = "A rule with a counted window carries no fairness constraint."
file = "rules/fairness/bounded-profile.fsl"
command = "compile requests/fairness/bounded-profile.json"
status = "running"
expect_exit = 21
expect_verdict = "unsupported: unsupported_construct"
serves = "Model checking reference (fairness)"

[[case]]
id = "fairness-unknown-operation"
rule = "ServedByStealing"
statement = "A fairness constraint names an operation of the model."
file = "rules/fairness/unknown-operation.fsl"
command = "compile requests/fairness/unknown-operation.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration"
serves = "Model checking reference (fairness)"

[[case]]
id = "model-subjects-two-locks"
rule = ""
statement = "Two processes take two locks in opposite orders."
file = "rules/model-subjects/two-locks.fsl"
command = "compile requests/model-subjects/two-locks.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Model checking reference (model subjects)"

[[case]]
id = "staged-one-served-strong"
rule = "ServedIfEachAcquireIsStronglyFair"
statement = "Process 1 holds the lock again and again when every acquire that is enabled again and again is taken."
file = "rules/fairness/one-served.fsl"
command = "analyze requests/staged-one-served.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1976"
why = "the rule compiles; deciding it over every behavior of the lock needs `quire analyze`, which exits 21 and prints nothing"
needs = "model checking from the command line"
serves = "Model checking reference (fairness)"

[[case]]
id = "staged-two-locks-deadlock"
rule = ""
statement = "Two processes that take two locks in opposite orders can reach a state where neither can move."
file = "rules/model-subjects/two-locks.fsl"
command = "analyze requests/staged-two-locks-deadlock.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1976"
why = "the units compile; finding the deadlock needs `quire analyze`, which exits 21 and prints nothing"
needs = "model checking from the command line"
serves = "Model checking reference (model subjects)"
