name = "types-checking"
summary = "Types and checking: type well-formedness, literal typing, equality admission and bounds, per the FSpec type model."

[[case]]
id = "decimal-literal-padded-member"
statement = "The literal decimal(1, 0) has the value 1, which is a member of Decimal[0, 10000; 2, 2; exact] as the coefficient 100 at scale 2, so the program checks."
file = "rules/decimal-literal-padded-member.fsl"
command = "check rules/decimal-literal-padded-member.fsl"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "decimal-literal-scale-above-smax-nonmember"
statement = "The literal decimal(150, 2) is 1.50, which needs scale 2 while Decimal[-9, 9; 0, 0; exact] allows scale 0, so it is refused as a type mismatch before evaluation."
file = "rules/decimal-literal-scale-above-smax-nonmember.fsl"
command = "check rules/decimal-literal-scale-above-smax-nonmember.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: ill_typed type-mismatch"

[[case]]
id = "decimal-literal-coefficient-nonmember"
statement = "The literal decimal(1234, 3) is 1.234, which needs scale 3 while Decimal[-1000, 1000; 0, 1; exact] allows scale at most 1, so it is not a member and is refused as a type mismatch."
file = "rules/decimal-literal-coefficient-nonmember.fsl"
command = "check rules/decimal-literal-coefficient-nonmember.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: ill_typed type-mismatch"

[[case]]
