status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "open-guard-stops"
rule = "OpeningGuardStops"
statement = "Opening the guard leaves the ram stopped."
file = "rules/press.fsl"
command = "run requests/open-guard-stops.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "open-guard-keeps-moving"
rule = "OpeningGuardStops"
statement = "Opening the guard leaves the ram stopped."
file = "rules/press.fsl"
command = "run requests/open-guard-keeps-moving.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "separation-ok"
rule = "SpeedAndSeparation"
statement = "While a person is in the cell, the arm keeps at least the protective separation from them (speed-and-separation monitoring)."
file = "rules/robot.fsl"
command = "run requests/separation-ok.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Landing card U5 (robot); Values reference (functions in rules)"

[[case]]
id = "separation-too-close"
