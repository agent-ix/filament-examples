# Work cell: press guard interlock and robot speed and separation
name = "cell"
summary = "A manufacturing cell with a hydraulic press behind a guard and a robot arm that shares space with people. Interlock invariants, pre/post rules on press operations, and a speed-and-separation rule."
model = "model/cell.semantic-ir.json"

[[case]]
id = "guard-closed-running"
rule = "GuardClosedWhileMoving"
statement = "The ram moves only while the guard is closed."
file = "rules/press.fsl"
command = "run requests/guard-closed-running.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3 (safety variant); landing card U5 PressInterlock"

[[case]]
id = "guard-open-running"
rule = "GuardClosedWhileMoving"
statement = "The ram moves only while the guard is closed."
file = "rules/press.fsl"
command = "run requests/guard-open-running.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Landing card U5"

[[case]]
id = "estop-holds"
rule = "EstopHolds"
statement = "While the emergency stop is pressed, the ram does not move."
file = "rules/press.fsl"
command = "run requests/estop-holds.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "estop-moving"
rule = "EstopHolds"
statement = "While the emergency stop is pressed, the ram does not move."
file = "rules/press.fsl"
command = "run requests/estop-moving.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "setup-slow"
rule = "SetupIsSlow"
statement = "In setup mode the ram moves at 10 mm/s or less."
file = "rules/press.fsl"
command = "run requests/setup-slow.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "setup-fast"
rule = "SetupIsSlow"
statement = "In setup mode the ram moves at 10 mm/s or less."
file = "rules/press.fsl"
command = "run requests/setup-fast.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "start-guard-closed"
rule = "StartNeedsGuard"
statement = "The press starts only with the guard closed and the emergency stop released."
file = "rules/press.fsl"
command = "run requests/start-guard-closed.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "start-guard-open"
rule = "StartNeedsGuard"
statement = "The press starts only with the guard closed and the emergency stop released."
file = "rules/press.fsl"
