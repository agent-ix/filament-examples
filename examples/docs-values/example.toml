[[case]]
id = "unguarded-remainder"
statement = "An unguarded divisor that can be zero is refused while compiling."
file = "rules/unguarded-remainder.fsl"
command = "compile requests/unguarded-remainder.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: unproved-nonzero"

