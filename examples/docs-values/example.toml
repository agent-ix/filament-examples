name = "docs-values"
summary = "Numeric programs used by the FSL documentation: selected division laws and guarded remainder."

[[case]]
id = "division-truncating-positive-positive"
rule = "bothPositive"
statement = "Under truncating division, 7 divided by 2 gives quotient 3 and remainder 1."
file = "rules/division-truncating.fsl"
command = "run requests/division-truncating-positive-positive.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "division-truncating-negative-positive"
rule = "negativeDividend"
statement = "Under truncating division, -7 divided by 2 gives quotient -3 and remainder -1."
file = "rules/division-truncating.fsl"
command = "run requests/division-truncating-negative-positive.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "division-truncating-positive-negative"
rule = "negativeDivisor"
statement = "Under truncating division, 7 divided by -2 gives quotient -3 and remainder 1."
file = "rules/division-truncating.fsl"
command = "run requests/division-truncating-positive-negative.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "division-truncating-negative-negative"
rule = "bothNegative"
statement = "Under truncating division, -7 divided by -2 gives quotient 3 and remainder -1."
file = "rules/division-truncating.fsl"
command = "run requests/division-truncating-negative-negative.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

