name = "operations-arithmetic"
summary = "Operations and arithmetic: integer division and range proofs, decimal, rational and float operations, conversions, collection operations and quantity arithmetic, with the Undefined outcomes and refusals the standard requires."

[[case]]
id = "mod-euclidean-whatever-the-law"
statement = "Under the truncating law mod is still the Euclidean remainder, so -7 mod 3 is 2, 7 mod -3 is 1 and -7 mod -3 is 2."
file = "rules/mod-euclidean-whatever-the-law.fsl"
command = "run requests/mod-euclidean-whatever-the-law.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "div-without-law-refused"
statement = "A unit that evaluates div and names no division law is refused as a missing selection, because no law is chosen by default."
file = "rules/div-without-law-refused.fsl"
command = "check rules/div-without-law-refused.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration missing-selection"

