name = "run-inputs"
summary = "Run inputs and results: call arguments in their value forms, refusals of bad arguments, zero-declaration units, run options and limits, and verification plan runs."

[[case]]
id = "call-zero-arguments"
statement = "LEGACY WIRE: A function with no parameter runs with no argument and completes with 5. The result is recorded in the driver's legacy untagged form {\"integer\": \"5\"}, which differs from the FR-181 typed form, and is kept as the single legacy case."
file = "rules/calls.fsl"
command = "run requests/call-zero-arguments.json"
status = "running"
expect_exit = 0
expect_verdict = "completed"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-two-arguments"
statement = "Two integer arguments are bound by parameter name and the sum 5 completes."
file = "rules/calls.fsl"
command = "run requests/call-two-arguments.json"
status = "running"
expect_exit = 0
expect_verdict = "5"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-arguments-reordered"
statement = "Arguments are matched by parameter name and never by position, so the reversed list gives the same 5."
file = "rules/calls.fsl"
command = "run requests/call-arguments-reordered.json"
status = "running"
expect_exit = 0
expect_verdict = "5"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-big-integer"
statement = "An integer is an exact decimal string at any magnitude: a 23-digit value comes back unchanged."
file = "rules/calls.fsl"
command = "run requests/call-big-integer.json"
status = "running"
expect_exit = 0
expect_verdict = "99999999999999999999999"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-negative-integer"
statement = "A negative integer is an optional minus and a decimal string."
file = "rules/calls.fsl"
command = "run requests/call-negative-integer.json"
status = "running"
expect_exit = 0
expect_verdict = "-5"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-zero-integer"
statement = "Zero is the string 0."
file = "rules/calls.fsl"
command = "run requests/call-zero-integer.json"
status = "running"
expect_exit = 0
expect_verdict = "0"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-boolean"
statement = "A Boolean argument comes back unchanged."
file = "rules/calls.fsl"
command = "run requests/call-boolean.json"
status = "running"
expect_exit = 0
expect_verdict = "true"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-sequence-at-bound"
statement = "A sequence of three integers meets the declared maximum of three and comes back in order."
file = "rules/calls.fsl"
command = "run requests/call-sequence-at-bound.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-sequence-empty"
statement = "An empty sequence meets the declared minimum of zero."
file = "rules/calls.fsl"
command = "run requests/call-sequence-empty.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-digit-at-max"
statement = "9 is the top of the declared range 0 to 9 and is admitted."
file = "rules/calls.fsl"
command = "run requests/call-digit-at-max.json"
status = "running"
expect_exit = 0
expect_verdict = "9"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-digit-at-min"
statement = "0 is the bottom of the declared range 0 to 9 and is admitted."
file = "rules/calls.fsl"
command = "run requests/call-digit-at-min.json"
status = "running"
expect_exit = 0
expect_verdict = "0"
serves = "FR-550-AC-1 (argument and result values)"

[[case]]
id = "call-unknown-function"
statement = "A call that names a function the unit does not declare is refused."
file = "rules/calls.fsl"
command = "run requests/call-unknown-function.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration"
serves = "FR-550-AC-2 (refused arguments)"

[[case]]
id = "call-tagged-integer"
statement = "An integer argument in the FR-181 typed canonical form {\"type\": \"integer\", \"value\": \"5\"} completes with the same form."
file = "rules/calls.fsl"
command = "run requests/call-tagged-integer.json"
status = "running"
expect_exit = 0
expect_verdict = "5"
serves = "FR-550-AC-1 (typed canonical form)"

[[case]]
id = "call-tagged-rational"
statement = "A rational argument 4/6 is read as 2/3: the result is the normalized form {\"type\": \"rational\", \"numerator\": \"2\", \"denominator\": \"3\"}."
file = "rules/calls.fsl"
command = "run requests/call-tagged-rational.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "FR-550-AC-1 (typed canonical form)"

[[case]]
id = "call-tagged-text"
statement = "A text argument in the typed canonical form comes back unchanged."
file = "rules/calls.fsl"
command = "run requests/call-tagged-text.json"
status = "running"
expect_exit = 0
expect_verdict = "hi"
serves = "FR-550-AC-1 (typed canonical form)"

[[case]]
id = "call-tagged-set-order"
statement = "A set argument supplied as 3 then 1 comes back with its elements in canonical order, 1 then 3."
file = "rules/calls.fsl"
command = "run requests/call-tagged-set-order.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "FR-550-AC-1 (typed canonical form)"

[[case]]
id = "unit-alias-only"
statement = "A type alias has no node of its own, so a unit that writes only an alias is an empty package."
file = "rules/alias-only.fsl"
command = "check rules/alias-only.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration"
serves = "FR-746"

[[case]]
id = "unit-one-function"
statement = "One function is a node-bearing declaration and the unit checks."
file = "rules/one-function.fsl"
command = "check rules/one-function.fsl"
status = "running"
expect_exit = 0
expect_verdict = "checked"
serves = "FR-746"

[[case]]
id = "option-engine-interpreter"
statement = "The interpreter engine runs the call and completes with 5."
file = "rules/calls.fsl"
command = "run requests/option-engine-interpreter.json --engine interpreter"
status = "running"
expect_exit = 0
expect_verdict = "5"
serves = "FR-306 (equivalent backends)"

[[case]]
id = "option-engine-unknown"
statement = "An engine name that is not interpreter, aot or jit is refused before the request runs."
file = "rules/calls.fsl"
command = "run requests/option-engine-unknown.json --engine bogus"
status = "running"
expect_exit = 20
expect_verdict = "refused: invalid-request"
serves = "FR-301-AC-3"

[[case]]
id = "option-request-bytes-too-small"
statement = "A request larger than --request-bytes is incomplete with a resource_exhausted cause and no value."
file = "rules/calls.fsl"
command = "run requests/option-request-bytes-too-small.json --request-bytes 10"
status = "running"
expect_exit = 22
expect_verdict = "incomplete: resource_exhausted"
serves = "FR-460, FR-461 (limits)"

[[case]]
id = "option-request-bytes-large"
statement = "A request within --request-bytes runs as without the option."
file = "rules/calls.fsl"
command = "run requests/option-request-bytes-large.json --request-bytes 100000"
status = "running"
expect_exit = 0
expect_verdict = "5"
serves = "FR-460, FR-461"

[[case]]
id = "option-dependent-bytes-too-small"
statement = "More dependent bytes than --dependent-bytes allows is incomplete with resource_exhausted."
file = "rules/calls.fsl"
command = "run requests/option-dependent-bytes-too-small.json --dependent-bytes 1"
status = "running"
expect_exit = 22
expect_verdict = "incomplete: resource_exhausted"
serves = "FR-460, FR-461"

[[case]]
id = "option-limit-unknown-setting"
statement = "A --limit that names no setting is refused, listing the settings it accepts."
file = "rules/calls.fsl"
command = "run requests/option-limit-unknown-setting.json --limit nonsense=1"
status = "running"
expect_exit = 20
expect_verdict = "refused: invalid-request"
serves = "FR-461, FR-720"

[[case]]
id = "option-limit-not-integer"
statement = "A --limit whose value is not an integer is refused."
file = "rules/calls.fsl"
command = "run requests/option-limit-not-integer.json --limit s1.input_bytes=x"
status = "running"
expect_exit = 20
expect_verdict = "refused: invalid-request"
serves = "FR-720"

[[case]]
id = "option-limit-source-bytes"
statement = "Source longer than the s1.input_bytes limit stops at that stage as incomplete and names the limit."
file = "rules/calls.fsl"
command = "run requests/option-limit-source-bytes.json --limit s1.input_bytes=10"
status = "running"
expect_exit = 22
expect_verdict = "incomplete: stage_limit_exceeded"
serves = "FR-460, FR-461, FR-720"

[[case]]
id = "monitor-empty-stream"
statement = "A stream with no records settles nothing: the eventually claim is pending, not proved and not refuted."
file = "rules/monitor-eventually.fsl"
command = "monitor requests/monitor-empty-stream.json --input records/monitor-empty.jsonl"
engine = "monitor"
status = "running"
expect_exit = 0
expect_verdict = "pending"
serves = "FR-161-AC-2 (pending rather than proved)"

[[case]]
id = "plan-passes"
statement = "Both steps of the plan settle proved, so the plan status is passed, the outcome has one disposition per step and the run exits 0."
file = "rules/plan-passes.fsl"
command = "run requests/plan-passes.json"
status = "running"
expect_exit = 0
expect_verdict = "plan passed"
serves = "FR-824 (plan run outcome)"

[[case]]
id = "plan-fails"
statement = "The step Low is refuted and the independent step Bounded is proved: the plan status is failed, failed_steps lists low, and the run exits 10."
file = "rules/plan-fails.fsl"
command = "run requests/plan-fails.json"
status = "running"
expect_exit = 10
expect_verdict = "plan failed: low"
serves = "FR-824 (plan run outcome)"

[[case]]
id = "plan-blocks"
statement = "Low is refuted and the step that requires it is blocked, never run: the plan status is failed, and the exit is 22 because FR-301 ranks incomplete above a violation."
file = "rules/plan-blocks.fsl"
command = "run requests/plan-blocks.json"
status = "running"
expect_exit = 22
expect_verdict = "plan failed: low; blocked: safe"
serves = "FR-824 (plan run outcome, severity order)"

[[case]]
id = "call-three-items-complete"
statement = "A request selecting three calls with tagged integer arguments 3, 5 and 7 yields three completed dispositions in selection order and category success."
file = "rules/calls.fsl"
command = "run requests/call-three-items-complete.json"
status = "running"
expect_exit = 0
expect_verdict = "3 completed"
serves = "FR-550-AC-3; FR-651 (multi-item request and results)"

[[case]]
id = "plan-null-members-as-absent"
statement = "A verification plan whose seed, emit, max_value_bits and max_trace_length members are null runs Release as if the four members were absent: both steps proved, exit 0."
file = "rules/plan-passes.fsl"
command = "run requests/plan-null-members-as-absent.json"
status = "running"
expect_exit = 0
expect_verdict = "plan passed"
serves = "FR-824-AC-6 (null members read as absent)"
