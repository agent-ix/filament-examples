file = "rules/calls.fsl"
command = "run requests/call-tagged-integer.json"
status = "staged"
expect_exit = 20
ready_exit = 0
waits_on = "QSL-2103"
why = "this build reads an integer as {\"integer\": \"5\"} and refuses the FR-181 tagged form, so the argument is refused wrong-value-kind (exit 20)"
needs = "arguments read in the FR-181 typed canonical form"
serves = "FR-550-AC-1 (typed canonical form)"

