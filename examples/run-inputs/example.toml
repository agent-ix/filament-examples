[[case]]
id = "unit-header-only"
statement = "A unit with only its header parses, and checking it is refused: a checked package needs at least one declaration that has a node."
file = "rules/header-only.fsl"
command = "check rules/header-only.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration"
serves = "FR-746, FR-339 (zero-declaration unit)"

[[case]]
id = "unit-profile-only"
statement = "A header and a profile are still no declaration: the check is refused as an empty package."
file = "rules/profile-only.fsl"
command = "check rules/profile-only.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration"
serves = "FR-746, FR-339"

[[case]]
id = "unit-alias-only"
statement = "A type alias has no node of its own, so a unit that writes only an alias is an empty package."
