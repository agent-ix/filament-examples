# Delivery rover: failsafe modes, sensor voting and safe stop
name = "rover"
summary = "A delivery rover drives on a lidar and three range sensors voted two-out-of-three. Without its lidar it slows down and must stop; in failsafe mode it stays still."
model = "model/rover.semantic-ir.json"

# Boolean arguments are passed as 1 (true) and 0 (false).
[[case]]
id = "vote-two-of-three"
rule = "twoOfThree"
statement = "The vote is true when at least two of its three inputs are true."
file = "rules/modes.fsl"
command = "run requests/vote-two-of-three.json"
status = "running"
expect_exit = 0
expect_verdict = "true"

[[case]]
id = "vote-one-of-three"
rule = "twoOfThree"
statement = "The vote is true when at least two of its three inputs are true."
file = "rules/modes.fsl"
command = "run requests/vote-one-of-three.json"
status = "running"
expect_exit = 0
expect_verdict = "false"

[[case]]
id = "failsafe-still"
rule = "FailsafeIsStill"
statement = "In failsafe mode the rover is stopped."
file = "rules/modes.fsl"
command = "run requests/failsafe-still.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3 (safety); landing card U1"

[[case]]
id = "failsafe-rolling"
rule = "FailsafeIsStill"
statement = "In failsafe mode the rover is stopped."
file = "rules/modes.fsl"
command = "run requests/failsafe-rolling.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "degraded-slow"
rule = "DegradedIsSlow"
statement = "Without its lidar the rover drives at 300 mm/s or less."
file = "rules/modes.fsl"
command = "run requests/degraded-slow.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "degraded-fast"
rule = "DegradedIsSlow"
statement = "Without its lidar the rover drives at 300 mm/s or less."
file = "rules/modes.fsl"
command = "run requests/degraded-fast.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "obstacle-crawl"
rule = "ObstacleSlows"
statement = "When two of the three range sensors see an obstacle within 500 mm, the rover crawls at 100 mm/s or less."
file = "rules/modes.fsl"
command = "run requests/obstacle-crawl.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Values reference (functions); sensor voting"

[[case]]
id = "obstacle-fast"
rule = "ObstacleSlows"
statement = "When two of the three range sensors see an obstacle within 500 mm, the rover crawls at 100 mm/s or less."
file = "rules/modes.fsl"
command = "run requests/obstacle-fast.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"

[[case]]
id = "obstacle-outvoted"
rule = "ObstacleSlows"
statement = "When two of the three range sensors see an obstacle within 500 mm, the rover crawls at 100 mm/s or less."
file = "rules/modes.fsl"
command = "run requests/obstacle-outvoted.json"
status = "running"
expect_exit = 0
expect_verdict = "holds: one sensor is outvoted"

[[case]]
id = "safe-stop-in-time"
rule = "SafeStopWithin3Steps"
statement = "Whenever the lidar is lost, the rover is stopped within three control steps."
file = "rules/safe-stop-steps.fsl"
command = "run requests/safe-stop-in-time.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L4 (traces); Guide: check a trace; landing hero H3 (step form)"

[[case]]
id = "safe-stop-late"
rule = "SafeStopWithin3Steps"
statement = "Whenever the lidar is lost, the rover is stopped within three control steps."
file = "rules/safe-stop-steps.fsl"
command = "run requests/safe-stop-late.json"
status = "running"
expect_exit = 10
expect_verdict = "violated: stopped 4 steps after the lidar was lost"
serves = "Learn L4; Guide: read a counterexample"

[[case]]
id = "control-loop-compiles"
rule = ""
statement = "The rover's control loop: sensor fusion every 10 ms, the stop monitor every 20 ms, path planning every 50 ms."
file = "rules/control-loop.fsl"
command = "compile requests/control-loop-compiles.json"
status = "running"
expect_exit = 0
expect_verdict = "checked task set"
serves = "Real-time reference (schedulability)"

[[case]]
id = "staged-control-loop-schedulable"
rule = ""
statement = "The control task set meets its deadlines, and the stop monitor responds within 10 ms."
file = "rules/control-loop.fsl"
command = "analyze requests/staged-control-loop-schedulable.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1976"
why = "fixed-priority schedulability and the 10 ms response bound need `quire analyze`, which exits 21"
serves = "Real-time reference; landing card U1"

[[case]]
id = "staged-safe-stop-200ms"
rule = ""
statement = "When the lidar is lost, the rover is stopped within 200 ms."
file = "rules/staged-safe-stop-200ms.fsl"
command = "compile requests/staged-safe-stop-200ms.json"
status = "staged"
expect_exit = 20
ready_exit = 0
waits_on = "QSL-1964"
why = "timestamped temporal rule is refused at S4: no selected clock configuration"
serves = "Landing hero H3 SafeStopWithin200ms; Learn L4 (clocks); card U1"

[[case]]
id = "staged-mode-machine"
rule = ""
statement = "On every behavior of the mode machine, the rover stops within three control steps of losing its lidar."
file = "rules/safe-stop-steps.fsl"
command = "analyze requests/staged-mode-machine.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1976"
why = "the same rule over every behaviour of the rover's mode machine needs `quire analyze`, which exits 21 and prints nothing"
serves = "Learn L5 (model checking)"

[[case]]
id = "staged-vote-probability"
rule = ""
statement = "Over 100 samples, the vote is wrong with probability at most 1 in 10,000."
file = "rules/staged-vote-probability.fsl"
command = "compile requests/staged-vote-probability.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-2000"
why = "checks at S3, then S4 refuses: \"random-parameter `sample(faultA)` cannot be written to a checked-package/v2 graph yet\"; checking the claim would further need `quire analyze` (QSL-1976)"
serves = "Learn L7 (probability); landing tab Probability"

[[case]]
id = "staged-controller-refinement"
rule = ""
statement = "Entering failsafe is the abstract stop of a vehicle."
file = "rules/staged-controller-refinement.fsl"
command = "analyze requests/staged-controller-refinement.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1976"
why = "the refinement compiles (both models admitted); checking it needs `quire analyze`, which exits 21"
serves = "Learn L8 (refinement); landing tab Refinement"

[[case]]
id = "staged-safe-stop-monitor"
rule = ""
statement = "A live feed of rover states is watched for the three-step safe stop."
file = "rules/safe-stop-steps.fsl"
command = "monitor requests/staged-safe-stop-monitor.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1977"
why = "running SafeStopWithin3Steps as a runtime monitor on a live feed needs `quire monitor`, which exits 21 and prints nothing"
serves = "Landing lifecycle stages 3-4; card U1"
