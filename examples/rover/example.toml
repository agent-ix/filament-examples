# Delivery rover: failsafe modes, sensor voting and safe stop
name = "rover"
summary = "A delivery rover drives on a lidar and three range sensors voted two-out-of-three. Without its lidar it slows down and must stop; in failsafe mode it stays still."
model = "model/rover.semantic-ir.json"

# Boolean arguments are passed as 1 (true) and 0 (false).
[[case]]
id = "vote-two-of-three"
rule = "twoOfThree"
statement = "The vote is true when at least two of its three inputs are true."
file = "rules/modes.fsl"
command = "run requests/vote-two-of-three.json"
status = "running"
expect_exit = 0
expect_verdict = "true"

[[case]]
id = "vote-one-of-three"
rule = "twoOfThree"
statement = "The vote is true when at least two of its three inputs are true."
file = "rules/modes.fsl"
command = "run requests/vote-one-of-three.json"
status = "running"
expect_exit = 0
expect_verdict = "false"

