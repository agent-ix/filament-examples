id = "failsafe-still"
rule = "FailsafeIsStill"
statement = "In failsafe mode the rover is stopped."
file = "rules/modes.fsl"
command = "run requests/failsafe-still.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3 (safety); landing card U1"

