[[case]]
id = "staged-deploy-bounded"
rule = ""
statement = "Across the whole plan (five steps), the service never drops below its minimum."
file = "rules/staged-deploy-temporal.fsl"
command = "compile requests/staged-deploy-bounded.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-2240"
why = "clock events over a model subject; the clock of a model claim is model-steps or model-time"
needs = "clock selection for counted windows"
serves = "Learn L4 (bounded windows)"

[[case]]
id = "staged-availability"
rule = ""
statement = "Checkout stays up through 10 calls in a row with probability at least 0.99."
file = "rules/staged-availability.fsl"
command = "compile requests/staged-availability.json"
engine = "probability"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-2000"
why = "checks at S3, then S4 refuses: \"random-parameter `call(ok)` cannot be written to a checked-package/v2 graph yet\"; checking the claim then runs through `fsl analyze`"
needs = "probability"
serves = "Landing card O6 / availability; Learn L7"

[[case]]
id = "probability-as-percent"
rule = "UpAsPercent"
statement = "A probability threshold written as a percentage, 99, is refused: a threshold lies strictly between 0 and 1."
file = "rules/probability-as-percent.fsl"
command = "compile requests/probability-as-percent.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: qualitative-threshold"
serves = "Learn: rules about chance (common misreading)"

