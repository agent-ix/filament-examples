# Library: a model written from scratch
name = "library"
summary = "A small library with books that can be on loan. The model comes from a short description, and one rule is compiled against it."
model = "model/library.semantic-ir.json"

[[case]]
id = "compile-ok"
rule = "OnLoanHasCopies"
statement = "A book on loan has at least one copy."
file = "rules/library.fsl"
command = "compile requests/compile-ok.json"
status = "running"
expect_exit = 0
expect_verdict = "compiles"

[[case]]
id = "compile-misspelled"
rule = "OnLoanHasCopies"
statement = "A rule that names a field the model does not have is refused."
file = "rules/misspelled.fsl"
command = "compile requests/compile-misspelled.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: no field copy"

[[case]]
id = "packages-link-ok"
rule = "OnLoanHasCopies"
statement = "A rule can call a function from a library it imports, and the two compile together."
file = "rules/packages/linked.fsl"
command = "compile requests/packages/link-ok.json"
status = "running"
expect_exit = 0
expect_verdict = "compiles"
serves = "Checks: packages"

[[case]]
id = "packages-link-missing"
rule = "OnLoanHasCopies"
statement = "An import with no library supplied under that name is refused."
file = "rules/packages/linked.fsl"
command = "compile requests/packages/link-missing.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing import"
serves = "Checks: packages"

[[case]]
id = "packages-multi-unit"
rule = "OnLoanHasCopies"
statement = "Two units compile into one package, and the second uses a function the first declares."
file = "rules/packages/multi-rules.fsl"
command = "compile requests/packages/multi-unit.json"
status = "running"
expect_exit = 0
expect_verdict = "compiles"
serves = "Checks: packages"

[[case]]
id = "packages-multi-unit-repeated"
rule = "OnLoanHasCopies"
statement = "The same source listed twice in one package is refused."
file = "rules/packages/multi-types.fsl"
command = "compile requests/packages/multi-unit-repeated.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: conflicting definition"
serves = "Checks: packages"
