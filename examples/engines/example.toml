[[case]]
id = "timed-within-200"
rule = "StopsWithin200ms"
statement = "Braking and halting each take at most 100 ms, so the rover is stopped within 200 ms: proved with a zone certificate."
file = "rules/deadline.fsl"
command = "analyze requests/timed-within-200.json"
engine = "timed"
clock = "model-time"
status = "running"
expect_exit = 0
expect_verdict = "proved"
serves = "FR-415, FR-416 (timed claims, zone search)"

[[case]]
