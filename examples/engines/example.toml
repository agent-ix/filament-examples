[[case]]
id = "hybrid-at-most-eight"
rule = "AtMostEight"
statement = "The charge peaks at 8 in a 12-second horizon, so charge <= 8 is proved by an accepted interval certificate."
file = "rules/hybrid.fsl"
command = "analyze requests/hybrid-at-most-eight.json"
status = "running"
expect_exit = 0
expect_verdict = "proved"
serves = "FR-193 (hybrid analysis)"

