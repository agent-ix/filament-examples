name = "engines"
summary = "Analysis engines and CLI verbs: hybrid, timed, probability, schedulability, deadlock, simulation and the verbs a build does not route."

[[case]]
id = "verb-prove-not-routed"
statement = "The prove verb is accepted but this build does not route it: the outcome names the verb under unsupported_operation and exits 21."
file = "rules/hybrid.fsl"
command = "prove requests/hybrid-at-most-eight.json"
status = "running"
expect_exit = 21
expect_verdict = "unsupported: operation-not-routed"
serves = "FR-522-AC-1, FR-301-AC-4 (unrouted verbs)"

[[case]]
id = "verb-generate-not-routed"
