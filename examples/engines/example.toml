[[case]]
id = "deadlock-no-terminal-refuted"
statement = "With no terminal declaration the full tank has no successor, so the deadlock-freedom item is refuted with a prefix that ends there."
file = "rules/tank-no-terminal.fsl"
command = "analyze requests/deadlock-no-terminal-refuted.json"
engine = "model-checking"
status = "staged"
expect_exit = 21
ready_exit = 10
waits_on = "QSL-2103"
why = "this binary settles each pre and post clause unsupported (unbounded-extent), so the request exits 21; the deadlock item itself is already refuted"
needs = "the deadlock-freedom item to settle through a request that also carries operation contracts"
serves = "FR-366 (deadlock freedom)"

