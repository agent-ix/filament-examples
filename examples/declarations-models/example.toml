statement = "A function that nothing calls is checked like any other and an unused declaration does no harm."
file = "rules/declaration-unused-admitted.fsl"
command = "check rules/declaration-unused-admitted.fsl"
status = "running"
expect_exit = 0
expect_verdict = "holds"

[[case]]
id = "declaration-unused-body-still-checked"
statement = "An unused function whose body can leave its declared result type is still refused as an unproved range."
file = "rules/declaration-unused-body-still-checked.fsl"
command = "check rules/declaration-unused-body-still-checked.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: undefined_expression unproved-range"

