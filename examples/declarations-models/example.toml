name = "declarations-models"
summary = "Declarations and models: unit and dimension graphs, profile selection, name resolution, object declarations and their clauses, and the declaration refusals the standard requires."

[[case]]
id = "unit-zero-scale-refused"
statement = "A unit with scale zero, unit zero : L = 0 * m, is refused as an invalid package at the unit and exposes no conversion."
file = "rules/unit-zero-scale-refused.fsl"
command = "check rules/unit-zero-scale-refused.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: invalid_package invalid-value"

