name = "language-values"
summary = "Original runnable value-language forms with independently stated semantic results."

[[case]]
id = "float-specials-nan"
rule = "example"
statement = "NaN is unequal to itself."
file = "rules/float-specials-nan.fsl"
command = "run requests/float-specials-nan.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"

