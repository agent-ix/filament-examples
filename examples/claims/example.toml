name = "claims"
summary = "Claims and temporal forms: every temporal operator on a trace, finite windows, false extension, model claims and the refusals of claim declarations."

[[case]]
id = "future-ev-prefix"
rule = "EventuallyP"
statement = "p first holds at position 2, in the prefix: eventually p is true."
file = "rules/future.fsl"
command = "run requests/future-ev-prefix.json"
engine = "timed"
clock = "steps"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "FR-091, FR-161, FR-367 (future operators)"

