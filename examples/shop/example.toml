[[case]]
id = "staged-charge-adds-amount"
rule = ""
file = "rules/staged-charge-adds-amount.fsl"
command = "compile requests/staged-charge-adds-amount.json"
status = "staged"
expect_exit = 20
ready_exit = 0
waits_on = "QSL-1901"
why = "post `self.charged = pre(self.charged) + amount` is refused undefined_expression/unproved-range: FR-577 (preconditions discharge a postcondition's range obligations) is specified but not implemented"
serves = "Learn L3 (preferred form of the post rule)"
