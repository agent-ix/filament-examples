# Shop: first steps
name = "shop"
summary = "An online shop takes orders, charges payments and issues refunds. Values, rules about data, rules about operations."
model = "model/shop.semantic-ir.json"

[[case]]
id = "values-line-total"
rule = "lineTotal"
statement = "A line costs price times quantity."
file = "rules/values.fsl"
command = "run requests/values-line-total.json"
status = "running"
expect_exit = 0
expect_verdict = "3750"
serves = "Learn L1; Values and types"

[[case]]
id = "values-with-shipping"
rule = "withShipping"
statement = "An order under 50 dollars adds 4.99 shipping."
file = "rules/values.fsl"
command = "run requests/values-with-shipping.json"
status = "running"
expect_exit = 0
expect_verdict = "4249"
serves = "Learn L1"

[[case]]
id = "values-free-shipping"
rule = "freeShipping"
statement = "An order of 50 dollars or more ships free."
file = "rules/values.fsl"
command = "run requests/values-free-shipping.json"
status = "running"
expect_exit = 0
expect_verdict = "false"
serves = "Learn L1"

[[case]]
id = "values-qty-zero"
rule = "lineTotal"
statement = "A quantity is between 1 and 99."
file = "rules/values.fsl"
command = "run requests/values-qty-zero.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: argument outside Qty"
serves = "Learn L2"

[[case]]
id = "values-too-narrow"
rule = ""
statement = "A line total must fit its declared result type."
file = "rules/values-too-narrow.fsl"
command = "check rules/values-too-narrow.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: undefined_expression unproved-range"
serves = "Learn L2; Values reference"

[[case]]
id = "paid-in-full"
rule = "PaidInFull"
statement = "A paid order has been charged its full total."
file = "rules/paid-in-full.fsl"
command = "run requests/paid-in-full.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L1 first rule; landing tab Domain and state"

[[case]]
id = "paid-short"
