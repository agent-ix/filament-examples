[[case]]
id = "charge-once-self-pair"
rule = "ChargeAtMostOnceSelfPair"
statement = "No two charges share an idempotency key, written without `a = b or`: each charge is paired with itself, so an order with distinct keys breaks it."
file = "rules/charge-once-self-pair.fsl"
command = "run requests/charge-once-self-pair.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn L3 state and invariants (common misreading: forall pairs include a charge with itself)"

