command = "run requests/paid-in-full-open.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L1 first rule (common misreading: implies)"

[[case]]
id = "misspelled-field"
rule = "PaidInFull"
statement = "A rule names only fields the model declares: `self.paid` is not a field of Order."
file = "rules/misspelled-field.fsl"
