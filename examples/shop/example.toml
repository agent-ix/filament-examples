# Shop: first steps
name = "shop"
summary = "An online shop takes orders, charges payments and issues refunds. Values, rules about data, rules about operations."
model = "model/shop.semantic-ir.json"

[[case]]
id = "values-line-total"
rule = "lineTotal"
statement = "A line costs price times quantity."
file = "rules/values.fsl"
command = "run requests/values-line-total.json"
status = "running"
expect_exit = 0
expect_verdict = "3750"
serves = "Learn L1; Values and types"

[[case]]
id = "values-with-shipping"
rule = "withShipping"
statement = "An order under 50 dollars adds 4.99 shipping."
file = "rules/values.fsl"
command = "run requests/values-with-shipping.json"
status = "running"
expect_exit = 0
expect_verdict = "4249"
serves = "Learn L1"

[[case]]
id = "values-free-shipping"
rule = "freeShipping"
statement = "An order of 50 dollars or more ships free."
file = "rules/values.fsl"
command = "run requests/values-free-shipping.json"
status = "running"
expect_exit = 0
expect_verdict = "false"
serves = "Learn L1"

[[case]]
id = "values-qty-zero"
rule = "lineTotal"
statement = "A quantity is between 1 and 99."
file = "rules/values.fsl"
command = "run requests/values-qty-zero.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: argument outside Qty"
serves = "Learn L2"

[[case]]
id = "values-too-narrow"
rule = ""
statement = "A line total must fit its declared result type."
file = "rules/values-too-narrow.fsl"
command = "check rules/values-too-narrow.fsl"
status = "running"
expect_exit = 20
expect_verdict = "refused: undefined_expression unproved-range"
serves = "Learn L2; Values reference"

[[case]]
id = "paid-in-full"
rule = "PaidInFull"
statement = "A paid order has been charged its full total."
file = "rules/paid-in-full.fsl"
command = "run requests/paid-in-full.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L1 first rule; landing tab Domain and state"

[[case]]
id = "paid-short"
rule = "PaidInFull"
statement = "A paid order has been charged its full total."
file = "rules/paid-in-full.fsl"
command = "run requests/paid-short.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn L1 first rule"

[[case]]
id = "paid-in-full-open"
rule = "PaidInFull"
statement = "A paid order has been charged its full total. An open order that is only partly charged does not break it."
file = "rules/paid-in-full.fsl"
command = "run requests/paid-in-full-open.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L1 first rule (common misreading: implies)"

[[case]]
id = "misspelled-field"
rule = "PaidInFull"
statement = "A rule names only fields the model declares: `self.paid` is not a field of Order."
file = "rules/misspelled-field.fsl"
command = "run requests/misspelled-field.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: ill_typed, the field paid is not on Order"
serves = "Learn L2 (the rule is checked against the model)"

[[case]]
id = "dangling-charge"
rule = "PaidInFull"
statement = "A paid order has been charged its full total."
file = "rules/orders.fsl"
command = "run requests/dangling-charge.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: charge c1 not in the data"
serves = "Learn L2"

[[case]]
id = "partial-data"
rule = "RefundsWithinCharge"
statement = "Refunds never add up to more than was charged."
file = "rules/orders.fsl"
command = "run requests/partial-data.json"
status = "running"
expect_exit = 22
expect_verdict = "incomplete"
serves = "Learn L2"

[[case]]
id = "refunds-within-charge"
rule = "RefundsWithinCharge"
statement = "Refunds never add up to more than was charged."
file = "rules/orders.fsl"
command = "run requests/refunds-within-charge.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3; landing hero H2; Collections reference"

[[case]]
id = "over-refunded"
rule = "RefundsWithinCharge"
statement = "Refunds never add up to more than was charged."
file = "rules/orders.fsl"
command = "run requests/over-refunded.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn L3; landing hero H2"

[[case]]
id = "charge-once-retry-new-key"
rule = "ChargeAtMostOnce"
statement = "A retried payment request is charged at most once: no two charges of an order carry the same idempotency key."
file = "rules/orders.fsl"
command = "run requests/charge-once-retry-new-key.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Landing hero H4; card U8"

[[case]]
id = "charge-once-charged-twice"
rule = "ChargeAtMostOnce"
statement = "A retried payment request is charged at most once: no two charges of an order carry the same idempotency key."
file = "rules/orders.fsl"
command = "run requests/charge-once-charged-twice.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Landing hero H4; card U8"

[[case]]
id = "charge-once-self-pair"
rule = "ChargeAtMostOnceSelfPair"
statement = "No two charges share an idempotency key, written without `a = b or`: each charge is paired with itself, so an order with distinct keys breaks it."
file = "rules/charge-once-self-pair.fsl"
command = "run requests/charge-once-self-pair.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn L3 state and invariants (common misreading: forall pairs include a charge with itself)"

[[case]]
id = "two-people-ok"
rule = "TwoPeople"
statement = "The second approver of a refund is a different person."
file = "rules/orders.fsl"
command = "run requests/two-people-ok.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Landing card U3"

[[case]]
id = "two-people-same"
rule = "TwoPeople"
statement = "The second approver of a refund is a different person."
file = "rules/orders.fsl"
command = "run requests/two-people-same.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Landing card U3"

[[case]]
id = "refund-small"
rule = "RefundApproval"
statement = "Refunds over $20 need a second approver."
file = "rules/operations.fsl"
command = "run requests/refund-small.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3; landing hero H1; FR-014 block"

[[case]]
id = "refund-large-one-approver"
rule = "RefundApproval"
statement = "Refunds over $20 need a second approver."
file = "rules/operations.fsl"
command = "run requests/refund-large-one-approver.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn L3; landing hero H1"

[[case]]
id = "refund-large-two-approvers"
rule = "RefundApproval"
statement = "Refunds over $20 need a second approver."
file = "rules/operations.fsl"
command = "run requests/refund-large-two-approvers.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Landing hero H1"

[[case]]
id = "charge-completes"
rule = "PaidWhenCovered"
statement = "A charge that covers the rest of the total leaves the order Paid."
file = "rules/operations.fsl"
command = "run requests/charge-completes.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3"

[[case]]
id = "charge-leaves-open"
rule = "PaidWhenCovered"
statement = "A charge that covers the rest of the total leaves the order Paid."
file = "rules/operations.fsl"
command = "run requests/charge-leaves-open.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn L3"

[[case]]
id = "charge-partial"
rule = "PaidWhenCovered"
statement = "A charge that covers the rest of the total leaves the order Paid. A charge that covers only part of it leaves the status free."
file = "rules/operations.fsl"
command = "run requests/charge-partial.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn: rules about operations (partial charge)"

[[case]]
id = "charge-partial-without-pre"
rule = "PaidWhenCoveredWithoutPre"
statement = "A charge that covers the rest of the total leaves the order Paid, written without pre(): the amount is counted twice, so a partial charge is wrongly required to leave the order Paid."
file = "rules/paid-when-covered-without-pre.fsl"
command = "run requests/charge-partial-without-pre.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "Learn: rules about operations (common misreading: pre)"

[[case]]
id = "charge-frame-ok"
rule = "Shop::Order::charge"
statement = "A charge changes only the amount charged and the status."
file = "rules/operations.fsl"
command = "run requests/charge-frame-ok.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "Learn L3 frames"

[[case]]
id = "charge-changes-total"
rule = "Shop::Order::charge"
statement = "A charge changes only the amount charged and the status."
file = "rules/operations.fsl"
command = "run requests/charge-changes-total.json"
status = "running"
expect_exit = 10
expect_verdict = "violated: frame (total changed)"
serves = "Learn L3 frames"

[[case]]
id = "charge-changes-total-post"
rule = "PaidWhenCovered"
statement = "A charge that covers the total leaves the order Paid."
file = "rules/operations.fsl"
command = "run requests/charge-changes-total-post.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: frame_violation"
serves = "Learn L3 frames"

[[case]]
id = "no-overcharge-ok"
rule = "NoOvercharge"
statement = "No order in the shop has been charged more than its total."
file = "rules/populations.fsl"
command = "run requests/no-overcharge-ok.json"
status = "running"
expect_exit = 0
expect_verdict = "holds"
serves = "State and models: populations"

[[case]]
id = "no-overcharge-other-order"
rule = "NoOvercharge"
statement = "No order in the shop has been charged more than its total."
file = "rules/populations.fsl"
command = "run requests/no-overcharge-other-order.json"
status = "running"
expect_exit = 10
expect_verdict = "violated"
serves = "State and models: populations"

[[case]]
id = "orders-over-bound"
rule = "OrderCapKept"
statement = "A snapshot with more orders than the population's bound is refused."
file = "rules/bounded-orders.fsl"
command = "run requests/orders-over-bound.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: cardinality_out_of_bound"
serves = "State and models: population bound"

[[case]]
id = "result-without-result"
rule = "NoteReturnsNothing"
statement = "A post rule cannot read the result of an operation that returns none."
file = "rules/result-without-result.fsl"
command = "compile requests/result-without-result.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: wrong_snapshot"
serves = "State reference: operation rules"

[[case]]
id = "staged-charge-adds-amount"
rule = ""
statement = "A charge adds exactly its amount to what the order has been charged."
file = "rules/staged-charge-adds-amount.fsl"
command = "compile requests/staged-charge-adds-amount.json"
status = "staged"
expect_exit = 20
ready_exit = 0
waits_on = "QSL-1901"
why = "post `self.charged = pre(self.charged) + amount` is refused undefined_expression/unproved-range: FR-577 (preconditions discharge a postcondition's range obligations) is specified but not implemented"
needs = "exact post-conditions"
serves = "Learn L3 (preferred form of the post rule)"

[[case]]
id = "staged-optional-parameter"
rule = ""
statement = "A rule can test whether an optional operation parameter is present."
file = "rules/staged-optional-parameter.fsl"
command = "compile requests/staged-optional-parameter.json"
status = "staged"
expect_exit = 20
ready_exit = 0
waits_on = "QSL-1983"
needs = "optional operation parameters"
why = "present(secondApprover) is refused ill_typed/type-mismatch: an optional operation parameter is typed as a required value, and a call cannot omit it"
serves = "State and models: optional operation parameters"

[[case]]
id = "staged-client-charges-once"
rule = ""
statement = "A client that retries a charge with an idempotency key implements a payment that is charged at most once."
file = "rules/staged-client-charges-once.fsl"
command = "analyze requests/staged-client-charges-once.json"
status = "staged"
expect_exit = 21
ready_exit = 0
waits_on = "QSL-1976"
needs = "refinement checking from the command line"
why = "the refinement compiles (both models admitted); checking it needs `quire analyze`, which exits 21"
serves = "Learn: refinement"

[[case]]
id = "client-retry-charges"
rule = "RetryCharges"
statement = "A refinement that maps every retry to a second charge compiles: compiling evaluates no rule."
file = "rules/client-retry-charges.fsl"
command = "compile requests/client-retry-charges.json"
status = "running"
expect_exit = 0
expect_verdict = "success: compiled, nothing checked"
serves = "Learn: evidence (common misreading)"

[[case]]
id = "refinement-without-stutter"
rule = "NoStutterRows"
statement = "A refinement without its stutter rows is refused: every operation of the design needs a step row."
file = "rules/refinement-without-stutter.fsl"
command = "compile requests/refinement-without-stutter.json"
status = "running"
expect_exit = 20
expect_verdict = "refused: missing_declaration"
serves = "Learn: refining a specification (common misreading)"

[[case]]
id = "refinement-charge-once"
rule = "ClientChargesOnce"
statement = "A client that retries a charge with an idempotency key refines a payment that is charged at most once: the declaration compiles."
file = "rules/staged-client-charges-once.fsl"
command = "compile requests/staged-client-charges-once.json"
status = "running"
expect_exit = 0
expect_verdict = "compiled"
serves = "Advanced analyses reference (refinement)"
