[package]
name = "agent-evals"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
url = "2"
base64 = "0.22"
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", rev = "0443d782436d33bd0a178d2745dca158e8e4acf5" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "0443d782436d33bd0a178d2745dca158e8e4acf5" }
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
