[package]
name = "agent-evals"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
url = "2"
regex = "1"
fsl-cst = { git = "https://github.com/agent-ix/filament-spec-language", rev = "deac8870a05e0b9ae28392f597f829011b44ebb8" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", rev = "deac8870a05e0b9ae28392f597f829011b44ebb8" }
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
